task_mode: prognosis
run_name: KIRP_OS_fold_0
model_path: pretrained_models/mjepa/KIRP_OS/fold_0/prognosis-best.pth.tar
output_path: outputs/inference
device: cuda:0
use_bfloat16: true
seed: 42

data:
  csv_path: data/processed/survival.csv
  batch_size: 16
  num_workers: 4
  pin_mem: true
  # Inference accepts null for unavailable modalities. Training requires all four.
  path_pt_path: data/processed/pathology.pt
  text_pt_path: data/processed/clinical.pt
  geno_pt_path: data/processed/mutation.pt
  tran_pt_path: data/processed/transcriptome.pt

models:
  text_encoder_name: pretrained_models/medgemma-1.5-4b-it
  path_dim: 768
  geno_raw_dim: 9920
  geno_dim: 512
  tran_dim: 643

MoE:
  num_experts: 8
  k: 2
  drop: 0.1
  hidden_size: 1024
