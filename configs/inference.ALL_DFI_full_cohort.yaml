# ALL_DFI full-cohort full-modality inference example.
# Copy and edit the paths for your own data and checkpoint.
task_mode: prognosis
run_name: full_cohort
model_path: pretrained_models/oncowm/ALL_DFI/full_cohort/prognosis_full_final.pth.tar
output_path: outputs/inference/ALL/ALL_DFI/prognosis/Full_modal
device: cuda:0
use_bfloat16: true
seed: 42

data:
  csv_path: data/processed/tcga/survival/ALL_DFI_dataset.csv
  batch_size: 64
  num_workers: 4
  pin_mem: true
  path_pt_path: data/processed/tcga/pathology/TCGA_TITAN_first_slice_dict.pt
  text_pt_path: data/processed/tcga/clinical/TCGA_data_clinical_patient_prompt.pt
  geno_pt_path: data/processed/tcga/mutation/TCGA-ALL.pt
  tran_pt_path: data/processed/tcga/transcriptome/TCGA-ALL.pt

models:
  text_encoder_name: pretrained_models/medgemma-1.5-4b-it
  path_dim: 768
  geno_raw_dim: 19766
  geno_dim: 512
  tran_dim: 643
  hidden_size: 1024
