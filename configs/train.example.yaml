# Illustrative five-fold training config. Tune hyperparameters for the target cohort.
seed: 10
num_folds: 5
output_path: outputs/train

meta:
  use_bfloat16: true

data:
  csv_path: data/processed/survival.csv
  path_pt_path: data/processed/pathology.pt
  text_pt_path: data/processed/clinical.pt
  geno_pt_path: data/processed/mutation.pt
  tran_pt_path: data/processed/transcriptome.pt
  align_batch_size: 32
  prognosis_batch_size: 32
  num_workers: 4
  pin_mem: true

models:
  # Local MedGemma model directory; do not commit model weights.
  text_encoder_name: pretrained_models/medgemma-1.5-4b-it
  path_dim: 768
  # Must equal the mutation vector length for this cancer type.
  geno_raw_dim: 9920
  geno_dim: 512
  tran_dim: 643

MoE:
  num_experts: 8
  k: 2
  drop: 0.1
  hidden_size: 1024

optimization:
  align_epochs: 100
  prognosis_epochs: 100
  patience: 15
  t2i_weight_decay: 0.04
  t2i_final_weight_decay: 0.4
  t2i_warmup: 10
  ipe_scale: 1.0
  align:
    start_lr: 0.000001
    lr: 0.0001
    final_lr: 0.000001
  prognosis:
    start_lr: 0.000001
    lr: 0.0001
    final_lr: 0.000001

logging:
  write_tag: metrics
  folder: outputs/train

tb:
  log_dir: outputs/tensorboard
